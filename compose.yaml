services:
  postgres:
    image: postgres:16
    container_name: timescale-results-postgres
    environment:
      POSTGRES_DB: timescale_results
      POSTGRES_USER: timescale_user
      POSTGRES_PASSWORD: timescale_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale_user -d timescale_results"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: